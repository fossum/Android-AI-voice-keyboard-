# Project-wide Gradle settings.

# AndroidX package structure is required by the dependencies in this project.
android.useAndroidX=true

# Enables automatic migration of third-party libraries that still use the old
# android.support namespace to the equivalent AndroidX counterparts at build time.
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
